<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="only light" />
<meta name="theme-color" content="#FBF7F0" />
<title>도형 밀기 시뮬레이션</title>
<style>
  * { box-sizing: border-box; }
  html { color-scheme: only light; }
  html, body {
    margin: 0; padding: 0;
    position: fixed; top: 0; right: 0; bottom: 0; left: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
  }
  #app {
    position: absolute; top: 0; right: 0; bottom: 0; left: 0;
    display: flex; flex-direction: column;
    background: #FBF7F0;
    color: #2B2A28;
    font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    padding: 12px 14px;
    padding:
      max(env(safe-area-inset-top), clamp(8px, 1.5vh, 16px))
      max(env(safe-area-inset-right), clamp(10px, 2vw, 20px))
      max(env(safe-area-inset-bottom), clamp(8px, 1.5vh, 16px))
      max(env(safe-area-inset-left), clamp(10px, 2vw, 20px));
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    max-width: 1100px;
    max-width: min(1100px, 100%);
    width: 100%;
    margin: 0 auto;
    height: 100%;
    min-height: 0;
    display: flex; flex-direction: column;
  }
  .title {
    font-size: 20px;
    font-size: clamp(16px, 2.4vh, 24px);
    font-weight: 800; margin: 0; color: #1F4B3F; flex-shrink: 0;
  }
  .subtitle {
    margin: 2px 0 8px; color: #6B6459;
    font-size: 13px;
    font-size: clamp(11px, 1.4vh, 14px); flex-shrink: 0;
  }
  @media (max-width: 600px) { .subtitle { display: none; } }
  .btn {
    padding: 9px 14px; min-height: 38px;
    border-radius: 10px; border: 2px solid #DDD5C4;
    background: #fff; color: #2B2A28;
    font-weight: 700; font-size: 13px; font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none; -webkit-user-select: none;
  }
  .btn:active { transform: scale(0.96); }
  .btn.on-green { background: #1F4B3F; color: #fff; border-color: #1F4B3F; }
  .btn.on-orange { background: #C1622D; color: #fff; border-color: #C1622D; }
  .btn.pill { padding: 8px 14px; min-height: 36px; border-radius: 999px; }
  .btn.small { padding: 6px 12px; min-height: 32px; font-size: 12px; }
  .btn.solid { background: #1F4B3F; color: #fff; border-color: #1F4B3F; }
  .btn.main { flex: 1; font-size: 15px; padding: 9px 0; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn.main:disabled { opacity: 0.5; }

  .shape-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; flex-shrink: 0; }

  .draw-bar {
    margin-bottom: 8px; padding: 6px 12px;
    background: #FFF3E9; border: 1px solid #F0D3B8; border-radius: 10px;
    font-size: 12px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 6px; flex-shrink: 0;
  }
  .draw-bar[hidden] { display: none; }
  .draw-actions { display: flex; gap: 6px; }

  .panels {
    display: flex; justify-content: center; align-items: center;
    flex: 1; min-height: 0; min-width: 0; overflow: hidden; gap: 8px;
  }
  .panel { flex: none; display: flex; flex-direction: column; align-items: center; }
  .panel-title {
    font-weight: 800; font-size: 14px; line-height: 20px; height: 20px;
    margin-bottom: 2px; text-align: center;
  }
  .grid-svg { background: #fff; border-radius: 12px; display: block; }

  .controls {
    margin-top: 8px; flex-shrink: 0;
    background: #fff; border: 1px solid #EBE4D6; border-radius: 12px; padding: 10px;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .label { width: 40px; font-weight: 700; color: #6B6459; font-size: 13px; }
  .btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions { display: flex; gap: 8px; margin-top: 6px; }

  .status {
    margin-top: 6px; flex-shrink: 0; padding: 8px 14px;
    background: #F0F5F2; border: 1px solid #D7E5DE; border-radius: 10px;
    font-size: 13px;
    font-size: clamp(12px, 1.6vh, 14px); font-weight: 600; color: #1F4B3F;
    text-align: center;
  }

  /* 화면 높이가 낮을 때(폰 가로 등): 제목을 숨기고 여백·버튼을 줄여 한 화면에 맞춤 */
  @media (max-height: 480px) {
    .title, .subtitle { display: none; }
    .btn { min-height: 30px; padding: 5px 10px; font-size: 12px; }
    .btn.pill { min-height: 30px; padding: 5px 12px; }
    .btn.small { min-height: 28px; padding: 4px 10px; }
    .btn.main { padding: 5px 0; }
    .shape-btns { margin-bottom: 4px; }
    .draw-bar { margin-bottom: 4px; padding: 4px 10px; }
    .controls { margin-top: 4px; padding: 6px 8px; display: flex; flex-wrap: wrap; column-gap: 12px; }
    .controls .row { margin-bottom: 4px; }
    .controls .actions { flex: 1 1 100%; margin-top: 2px; }
    .status { margin-top: 4px; padding: 5px 10px; }
  }
  /* 세로로 든 작은 폰(예: 320x568): 여백·버튼을 줄이고, 도형을 그리는 동안은 조작 버튼을 숨겨 격자판 공간 확보 */
  @media (max-width: 600px) and (max-height: 700px) and (orientation: portrait) {
    .btn { min-height: 32px; padding: 6px 10px; font-size: 12px; }
    .btn.pill { min-height: 32px; padding: 6px 12px; }
    .btn.small { min-height: 28px; padding: 4px 10px; }
    .btn.main { padding: 6px 0; }
    .btns .btn { min-width: 0 !important; }
    .shape-btns { margin-bottom: 6px; }
    .draw-bar { margin-bottom: 6px; padding: 4px 10px; }
    .controls { margin-top: 6px; padding: 8px; }
    .row { margin-bottom: 4px; }
    .status { margin-top: 4px; padding: 6px 10px; }
    .drawing-active .controls { display: none; }
  }
  @media (max-width: 360px) and (orientation: portrait) {
    .btns { gap: 4px; }
    .btns .btn { padding: 6px 6px; }
    .label { width: 32px; }
    .row { gap: 6px; }
  }
  @media (max-height: 620px) and (orientation: portrait) { .title { display: none; } }
  /* 폰 가로 모드: 조작 버튼을 오른쪽 열로 옮겨 격자판을 최대한 크게 */
  @media (max-height: 480px) and (orientation: landscape) {
    .wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 250px;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      column-gap: 8px;
    }
    .shape-btns { grid-column: 1; grid-row: 1; }
    .draw-bar { grid-column: 1; grid-row: 2; }
    .panels { grid-column: 1; grid-row: 3; }
    .controls { grid-column: 2; grid-row: 1 / span 3; margin-top: 0; display: block; overflow: hidden; align-self: start; }
    .status { grid-column: 1 / span 2; grid-row: 4; }
    .btn.pill { padding: 5px 9px; }
    .draw-bar { font-size: 11px; }
    .drawing-active .wrap { grid-template-columns: minmax(0, 1fr); }
    .drawing-active .controls { display: none; }
    .drawing-active .status { grid-column: 1; }
  }
  @media (max-height: 480px) and (max-width: 640px) and (orientation: landscape) {
    .wrap { grid-template-columns: minmax(0, 1fr) 210px; }
  }

  /* flex gap 미지원 브라우저(iOS 14.4 이하 등)용 여백 대체 */
  .no-flex-gap .shape-btns > *, .no-flex-gap .btns > *, .no-flex-gap .draw-actions > * { margin: 0 6px 6px 0; }
  .no-flex-gap .row > * { margin-right: 8px; }
  .no-flex-gap .row > .btns { margin-right: 0; }
  .no-flex-gap .actions > * + * { margin-left: 8px; }
  .no-flex-gap .draw-bar > * { margin-right: 6px; }
</style>
</head>
<body>
<div id="app">
  <div class="wrap">
    <h1 class="title">도형 밀기 시뮬레이션</h1>
    <p class="subtitle">도형을 위쪽·아래쪽·왼쪽·오른쪽으로 밀면 어떻게 되는지 알아봅시다. 이어서 여러 번 밀 수도 있어요.</p>

    <div class="shape-btns" id="shapeBtns"></div>

    <div class="draw-bar" id="drawBar" hidden>
      <span id="drawMsg"></span>
      <div class="draw-actions">
        <button class="btn small solid" id="finishBtn">도형 완성</button>
        <button class="btn small" id="clearBtn">다시 그리기</button>
      </div>
    </div>

    <div class="panels" id="panels">
      <svg class="grid-svg" id="board"></svg>
    </div>

    <div class="controls">
      <div class="row"><span class="label">방향</span><div class="btns" id="dirBtns"></div></div>
      <div class="row"><span class="label">칸 수</span><div class="btns" id="distBtns"></div></div>
      <div class="actions">
        <button class="btn main solid" id="actionBtn">밀기</button>
        <button class="btn" id="homeBtn" style="padding:9px 14px">처음 위치에서 다시</button>
        <button class="btn" id="resetBtn" style="padding:9px 14px">초기화</button>
      </div>
    </div>

    <div class="status" id="status"></div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // flex gap 미지원 브라우저 감지 → 여백을 margin으로 대체
  (function () {
    var f = document.createElement('div');
    f.style.cssText = 'display:flex;flex-direction:column;row-gap:1px;position:absolute;visibility:hidden';
    f.appendChild(document.createElement('div'));
    f.appendChild(document.createElement('div'));
    document.body.appendChild(f);
    var ok = f.scrollHeight === 1;
    document.body.removeChild(f);
    if (!ok) document.documentElement.className += ' no-flex-gap';
  })();

  // ---------- 모눈판 설정 (교과서처럼 큰 모눈판 하나) ----------
  var N = 19;                       // 19 x 19 칸
  var U = 30;                       // 칸 하나(viewBox 단위)
  var PAD = 16;
  var VB = N * U + PAD * 2;
  var NS = 'http://www.w3.org/2000/svg';
  var GREEN = '#5FA136';
  function toPx(p) { return { x: PAD + p.x * U, y: PAD + p.y * U }; }

  // ---------- 기본 도형 (교과서 모양, 모눈판 가운데 배치) ----------
  var PRESETS = {
    '삼각형': [{ pts: [{ x: 8, y: 11 }, { x: 11, y: 11 }, { x: 9, y: 8 }] }],
    '사각형': [{ pts: [{ x: 7, y: 8 }, { x: 11, y: 8 }, { x: 10, y: 10 }, { x: 8, y: 10 }] }],
    '집 모양': [
      { pts: [{ x: 8, y: 12 }, { x: 11, y: 12 }, { x: 11, y: 10 }, { x: 8, y: 10 }], fill: '#FFD666', stroke: '#D9A32B' },
      { pts: [{ x: 7, y: 10 }, { x: 12, y: 10 }, { x: 10.5, y: 7 }, { x: 8.5, y: 7 }], fill: '#6FD8F5', stroke: '#2AA9CE' }
    ]
  };
  var DRAW = '직접 그리기';
  var DIRS = [
    { key: 'up',    label: '↑ 위쪽',   name: '위쪽',   dx: 0,  dy: -1 },
    { key: 'down',  label: '↓ 아래쪽', name: '아래쪽', dx: 0,  dy: 1 },
    { key: 'left',  label: '← 왼쪽',   name: '왼쪽',   dx: -1, dy: 0 },
    { key: 'right', label: '→ 오른쪽', name: '오른쪽', dx: 1,  dy: 0 }
  ];
  var DISTS = [1, 2, 3, 4, 5, 6, 7];
  var DEFAULT_STATUS = "방향과 칸 수를 고르고 '밀기'를 눌러 보세요.";

  // ---------- 상태 ----------
  var state = {
    shapeName: '삼각형',
    customPoints: [],
    drawingMode: false,
    direction: 'right',
    dist: 7,
    pos: { x: 0, y: 0 },      // 지금 도형이 처음 위치에서 옮겨진 칸 수
    path: [],                 // 이번에 민 과정 [{ dir, n, from, to }]
    kept: [],                 // 남겨 둔 이전 결과 [{ pos, path }]
    anim: null,               // { from, vec, t }
    status: DEFAULT_STATUS
  };
  var rafId = null, pauseId = null;

  // ---------- DOM 참조 ----------
  var $ = function (id) { return document.getElementById(id); };
  var shapeBtns = $('shapeBtns'), drawBar = $('drawBar'), drawMsg = $('drawMsg');
  var finishBtn = $('finishBtn'), clearBtn = $('clearBtn');
  var panels = $('panels'), board = $('board');
  var dirBtns = $('dirBtns'), distBtns = $('distBtns');
  var actionBtn = $('actionBtn'), homeBtn = $('homeBtn'), resetBtn = $('resetBtn'), statusEl = $('status');
  board.setAttribute('viewBox', '0 0 ' + VB + ' ' + VB);

  // ---------- 헬퍼 ----------
  function S(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function dirOf(key) { return DIRS.filter(function (d) { return d.key === key; })[0]; }
  function getParts() {
    return state.shapeName === DRAW ? [{ pts: state.customPoints }] : PRESETS[state.shapeName];
  }
  function allPts() {
    var out = [];
    getParts().forEach(function (p) { out = out.concat(p.pts); });
    return out;
  }
  function hasShape() {
    if (state.shapeName !== DRAW) return true;
    return !state.drawingMode && state.customPoints.length >= 3;
  }
  function bbox(pts, off) {
    var b = { minx: 1e9, maxx: -1e9, miny: 1e9, maxy: -1e9 };
    pts.forEach(function (p) {
      b.minx = Math.min(b.minx, p.x + off.x); b.maxx = Math.max(b.maxx, p.x + off.x);
      b.miny = Math.min(b.miny, p.y + off.y); b.maxy = Math.max(b.maxy, p.y + off.y);
    });
    return b;
  }
  // 모눈판 밖으로 나가지 않고 밀 수 있는 최대 칸 수 (지금 위치에서)
  function maxDist(key) {
    if (!hasShape()) return 0;
    var b = bbox(allPts(), state.pos);
    if (key === 'right') return Math.floor(N - b.maxx);
    if (key === 'left') return Math.floor(b.minx);
    if (key === 'up') return Math.floor(b.miny);
    return Math.floor(N - b.maxy);
  }
  function busy() { return !!state.anim; }
  function canMove() {
    return hasShape() && !busy() && state.dist <= maxDist(state.direction);
  }

  // ---------- 그리기 요소 ----------
  function drawGrid() {
    var g = S('g', {}, board);
    for (var i = 1; i < N; i++) {
      var a = toPx({ x: i, y: 0 }), b = toPx({ x: i, y: N });
      S('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#7DA6E3', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, g);
      var c = toPx({ x: 0, y: i }), d = toPx({ x: N, y: i });
      S('line', { x1: c.x, y1: c.y, x2: d.x, y2: d.y, stroke: '#7DA6E3', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, g);
    }
    var o = toPx({ x: 0, y: 0 });
    S('rect', { x: o.x, y: o.y, width: N * U, height: N * U, fill: 'none', stroke: '#3D7BD9', 'stroke-width': 2.5 }, g);
  }

  function drawShapeAt(parent, off, faded) {
    var g = S('g', { transform: 'translate(' + off.x * U + ' ' + off.y * U + ')', opacity: faded ? 0.55 : 1 }, parent);
    getParts().forEach(function (part) {
      if (part.pts.length < 2) return;
      var pts = part.pts.map(function (p) { var q = toPx(p); return q.x + ',' + q.y; }).join(' ');
      S('polygon', {
        points: pts,
        fill: part.fill || 'none',
        stroke: part.stroke || GREEN,
        'stroke-width': part.fill ? 3 : 3.5,
        'stroke-linejoin': 'round'
      }, g);
    });
    return g;
  }

  // 교과서 같은 말풍선 이름표 (도형 아래, 공간이 없으면 위)
  function drawTag(off, text, kind) {
    var b = bbox(allPts(), off);
    var cx = toPx({ x: (b.minx + b.maxx) / 2, y: 0 }).x;
    var below = b.maxy + 1.4 <= N;
    var w = text.length * 16 + 26, h = 28;
    var tipY = below ? toPx({ x: 0, y: b.maxy }).y + 6 : toPx({ x: 0, y: b.miny }).y - 6;
    var y = below ? tipY + 7 : tipY - 7 - h;
    var fill = kind === 'before' ? '#F6E7A6' : '#A9DCDC';
    var stroke = kind === 'before' ? '#D9B84A' : '#5BB0B0';
    var g = S('g', {}, board);
    var tri = below
      ? (cx - 6) + ',' + (y + 1) + ' ' + (cx + 6) + ',' + (y + 1) + ' ' + cx + ',' + tipY
      : (cx - 6) + ',' + (y + h - 1) + ' ' + (cx + 6) + ',' + (y + h - 1) + ' ' + cx + ',' + tipY;
    S('polygon', { points: tri, fill: fill, stroke: stroke, 'stroke-width': 1.5 }, g);
    S('rect', { x: cx - w / 2, y: y, width: w, height: h, rx: 9, fill: fill, stroke: stroke, 'stroke-width': 1.5 }, g);
    S('polygon', { points: tri, fill: fill }, g);
    var t = S('text', { x: cx, y: y + h / 2 + 6, 'text-anchor': 'middle', 'font-size': 16, 'font-weight': 800, fill: '#3A3A3A', 'font-family': 'inherit' }, g);
    t.textContent = text;
  }

  // 민 과정을 보여주는 주황 화살표 (각 구간의 가운데에 교과서처럼 짧은 화살표 + 칸 수)
  function drawPath(path, faded) {
    var g = S('g', { opacity: faded ? 0.5 : 1 }, board);
    var ref = allPts()[0];
    var multi = path.length > 1;   // 여러 번 이어서 밀었으면 화살표를 칸 세기 점선 옆에 둠
    path.forEach(function (seg) {
      var a = toPx({ x: ref.x + seg.from.x, y: ref.y + seg.from.y });
      var b = toPx({ x: ref.x + seg.to.x, y: ref.y + seg.to.y });
      // 구간을 따라 옅은 점선(칸 세기용)
      S('line', { x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: '#E8806A', 'stroke-width': 2, 'stroke-dasharray': '2 5', 'stroke-linecap': 'round', opacity: 0.8 }, g);
      [a, b].forEach(function (p) { S('circle', { cx: p.x, cy: p.y, r: 4, fill: '#E8806A' }, g); });
      // 굵은 화살표: 교과서처럼 두 도형 사이 빈 곳 가운데에 둠 (빈 곳이 좁으면 도형 바깥쪽 옆에)
      var d = dirOf(seg.dir);
      var b0 = bbox(allPts(), seg.from), b1 = bbox(allPts(), seg.to);
      var gap, mx, my;
      if (d.dx) {
        gap = d.dx > 0 ? b1.minx - b0.maxx : b0.minx - b1.maxx;
        my = toPx({ x: 0, y: (b0.miny + b0.maxy) / 2 }).y;
        mx = toPx({ x: d.dx > 0 ? (b0.maxx + b1.minx) / 2 : (b0.minx + b1.maxx) / 2, y: 0 }).x;
        if (gap < 1.4 || multi) { mx = (a.x + b.x) / 2; my = a.y - U * 0.75; }
      } else {
        gap = d.dy > 0 ? b1.miny - b0.maxy : b0.miny - b1.maxy;
        mx = toPx({ x: (b0.minx + b0.maxx) / 2, y: 0 }).x;
        my = toPx({ x: 0, y: d.dy > 0 ? (b0.maxy + b1.miny) / 2 : (b0.miny + b1.maxy) / 2 }).y;
        if (gap < 1.4 || multi) { my = (a.y + b.y) / 2; mx = a.x - U * 0.75; }
      }
      var len = Math.max(U * 0.6, Math.min(U * 1.4, Math.max(gap, 0.8) * U * 0.7));
      var sx = mx - d.dx * len / 2, sy = my - d.dy * len / 2;
      var ex = mx + d.dx * len / 2, ey = my + d.dy * len / 2;
      var hl = 10, bx = ex - d.dx * hl, by = ey - d.dy * hl, nx = -d.dy, ny = d.dx;
      S('line', { x1: sx, y1: sy, x2: bx, y2: by, stroke: '#E0674F', 'stroke-width': 6, 'stroke-linecap': 'round' }, g);
      S('polygon', { points: ex + ',' + ey + ' ' + (bx + nx * 9) + ',' + (by + ny * 9) + ' ' + (bx - nx * 9) + ',' + (by - ny * 9), fill: '#E0674F' }, g);
      var leftSide = !d.dx && mx < a.x;
      var lx = mx + (d.dx ? 0 : (leftSide ? -16 : 16)), ly = my + (d.dx ? -14 : 5);
      var anchor = d.dx ? 'middle' : (leftSide ? 'end' : 'start');
      if (d.dx && multi) {   // 여러 번 밀었을 때 가로 화살표의 칸 수는 화살표 뒤쪽 옆에 둠
        lx = d.dx > 0 ? sx - 6 : sx + 6; ly = my + 5; anchor = d.dx > 0 ? 'end' : 'start';
      }
      var t = S('text', {
        x: lx, y: ly, 'text-anchor': anchor, 'font-size': 15, 'font-weight': 800, fill: '#C1452D',
        stroke: '#fff', 'stroke-width': 4, 'stroke-linejoin': 'round', 'paint-order': 'stroke', 'font-family': 'inherit'
      }, g);
      t.textContent = seg.n + '칸';
    });
  }

  // ---------- 렌더링 ----------
  function renderShapeButtons() {
    shapeBtns.textContent = '';
    Object.keys(PRESETS).forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'btn pill' + (state.shapeName === name ? ' on-green' : '');
      b.textContent = name;
      b.addEventListener('click', function () { selectShape(name); });
      shapeBtns.appendChild(b);
    });
    var d = document.createElement('button');
    d.className = 'btn pill' + (state.shapeName === DRAW ? ' on-orange' : '');
    d.textContent = '✏️ 직접 그리기';
    d.addEventListener('click', startDrawing);
    shapeBtns.appendChild(d);
  }

  function renderDrawBar() {
    var show = state.shapeName === DRAW;
    drawBar.hidden = !show;
    var root = document.documentElement;
    var cls = (' ' + root.className + ' ').replace(' drawing-active ', ' ');
    root.className = (cls + (show && state.drawingMode ? 'drawing-active' : '')).replace(/^\s+|\s+$/g, '');
    if (!show) return;
    var n = state.customPoints.length;
    drawMsg.textContent = state.drawingMode
      ? '모눈판의 점을 차례로 눌러 도형을 그려 보세요. (점 ' + n + '개)'
      : '도형이 완성되었어요. 방향과 칸 수를 골라 밀어 보세요.';
    finishBtn.disabled = !(state.drawingMode && n >= 3);
  }

  function renderBoard() {
    board.textContent = '';
    drawGrid();
    var drawing = state.shapeName === DRAW && state.drawingMode;

    if (drawing) {
      drawShapeAt(board, { x: 0, y: 0 }, false);
      state.customPoints.forEach(function (p) {
        var q = toPx(p);
        S('circle', { cx: q.x, cy: q.y, r: 5, fill: '#C1622D', stroke: '#fff', 'stroke-width': 1.5 }, board);
      });
      var catcher = S('rect', { x: 0, y: 0, width: VB, height: VB, fill: 'transparent', style: 'cursor:crosshair' }, board);
      catcher.addEventListener('click', handleDrawClick);
      board.style.touchAction = 'none';
      return;
    }
    board.style.touchAction = 'manipulation';
    if (!hasShape()) return;

    // 남겨 둔 이전 결과
    state.kept.forEach(function (k) {
      drawPath(k.path, true);
      drawShapeAt(board, k.pos, true);
    });
    var moved = state.pos.x !== 0 || state.pos.y !== 0 || state.anim;
    // 밀기 전 (처음 위치)
    drawShapeAt(board, { x: 0, y: 0 }, false);
    if (state.anim) {
      var a = state.anim;
      var off = { x: a.from.x + a.vec.x * a.t, y: a.from.y + a.vec.y * a.t };
      drawShapeAt(board, off, false);
    } else if (moved) {
      drawShapeAt(board, state.pos, false);
    }
    drawTag({ x: 0, y: 0 }, '밀기 전', 'before');
    if (moved && !state.anim) drawTag(state.pos, '민 후', 'after');
    drawPath(state.path, false);
  }

  function renderControls() {
    Array.prototype.forEach.call(dirBtns.children, function (b, i) {
      b.className = 'btn' + (state.direction === DIRS[i].key ? ' on-green' : '');
      b.disabled = !hasShape() || busy() || maxDist(DIRS[i].key) < 1;
    });
    var max = maxDist(state.direction);
    Array.prototype.forEach.call(distBtns.children, function (b, i) {
      b.className = 'btn' + (state.dist === DISTS[i] ? ' on-orange' : '');
      b.disabled = !hasShape() || busy() || DISTS[i] > max;
    });
    actionBtn.disabled = !canMove();
    homeBtn.disabled = busy() || !hasShape() || state.path.length === 0;
  }

  function renderStatus() { statusEl.textContent = state.status; }

  function fixChoice() {
    if (!hasShape()) return;
    if (maxDist(state.direction) < 1) {
      for (var i = 0; i < DIRS.length; i++) if (maxDist(DIRS[i].key) >= 1) { state.direction = DIRS[i].key; break; }
    }
    var m = maxDist(state.direction);
    if (m >= 1 && state.dist > m) state.dist = m;
  }

  function render() {
    fixChoice();
    renderShapeButtons();
    renderDrawBar();
    renderBoard();
    renderControls();
    renderStatus();
    layoutBoard();
  }

  function describe(path) {
    return path.map(function (s, i) {
      return dirOf(s.dir).name + '으로 ' + s.n + '칸 ' + (i === path.length - 1 ? '밀었어요.' : '밀고');
    }).join(' ');
  }

  // ---------- 동작 ----------
  function handleDrawClick(e) {
    var rect = board.getBoundingClientRect();
    if (rect.width <= 0) return;
    var k = VB / rect.width;
    var gx = Math.round(((e.clientX - rect.left) * k - PAD) / U);
    var gy = Math.round(((e.clientY - rect.top) * k - PAD) / U);
    if (gx < 0 || gx > N || gy < 0 || gy > N) return;
    state.customPoints.push({ x: gx, y: gy });
    renderDrawBar(); renderBoard(); renderControls();
  }

  function startMove() {
    if (!canMove()) return;
    var d = dirOf(state.direction);
    var total = state.dist;
    var from = { x: state.pos.x, y: state.pos.y };
    var seg = { dir: d.key, n: 0, from: from, to: from };
    state.path.push(seg);
    var step = 0;
    function doStep() {
      step += 1;
      var stepFrom = { x: from.x + d.dx * (step - 1), y: from.y + d.dy * (step - 1) };
      state.anim = { from: stepFrom, vec: { x: d.dx, y: d.dy }, t: 0 };
      state.status = d.name + '으로 미는 중... (' + step + '/' + total + '칸)';
      renderControls(); renderStatus();
      var start = null;
      function tick(now) {
        if (start === null) start = now;
        var t = Math.min(1, (now - start) / 380);
        state.anim.t = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        seg.n = step - 1 + state.anim.t;
        seg.to = { x: stepFrom.x + d.dx * state.anim.t, y: stepFrom.y + d.dy * state.anim.t };
        renderBoard();
        if (t < 1) { rafId = requestAnimationFrame(tick); return; }
        seg.n = step;
        seg.to = { x: from.x + d.dx * step, y: from.y + d.dy * step };
        if (step < total) { pauseId = setTimeout(doStep, 90); return; }
        state.anim = null;
        state.pos = seg.to;
        state.status = describe(state.path) + ' 모양과 위치는 어떻게 되었나요?';
        fixChoice();
        render();
      }
      rafId = requestAnimationFrame(tick);
    }
    doStep();
  }

  function goHome() {
    if (busy() || state.path.length === 0) return;
    state.kept.push({ pos: state.pos, path: state.path });
    state.pos = { x: 0, y: 0 };
    state.path = [];
    state.status = '앞의 결과는 흐리게 남겨 두었어요. 처음 위치에서 다른 방향으로 밀어 보세요.';
    render();
  }

  function reset() {
    if (rafId) cancelAnimationFrame(rafId);
    if (pauseId) clearTimeout(pauseId);
    state.anim = null;
    state.pos = { x: 0, y: 0 };
    state.path = [];
    state.kept = [];
    state.status = DEFAULT_STATUS;
  }
  function selectShape(name) { reset(); state.shapeName = name; state.drawingMode = false; render(); }
  function startDrawing() { reset(); state.shapeName = DRAW; state.customPoints = []; state.drawingMode = true; render(); }
  function finishDrawing() {
    if (state.customPoints.length >= 3) { state.drawingMode = false; render(); }
  }
  function clearDrawing() { reset(); state.customPoints = []; state.drawingMode = true; render(); }

  // ---------- 화면 크기에 맞춰 모눈판 크기 계산 (아이폰 주소창 변화 대응) ----------
  function layoutBoard() {
    var side = Math.floor(Math.max(120, Math.min(panels.clientWidth, panels.clientHeight, 820)));
    board.setAttribute('width', side);
    board.setAttribute('height', side);
  }

  // ---------- 초기화 ----------
  DIRS.forEach(function (d) {
    var b = document.createElement('button');
    b.textContent = d.label;
    b.style.minWidth = '80px';
    b.addEventListener('click', function () { state.direction = d.key; fixChoice(); renderControls(); });
    dirBtns.appendChild(b);
  });
  DISTS.forEach(function (n) {
    var b = document.createElement('button');
    b.textContent = n + '칸';
    b.style.minWidth = '48px';
    b.addEventListener('click', function () { state.dist = n; renderControls(); });
    distBtns.appendChild(b);
  });
  finishBtn.addEventListener('click', finishDrawing);
  clearBtn.addEventListener('click', clearDrawing);
  actionBtn.addEventListener('click', startMove);
  homeBtn.addEventListener('click', goHome);
  resetBtn.addEventListener('click', function () { reset(); render(); });

  window.addEventListener('resize', layoutBoard);
  window.addEventListener('orientationchange', layoutBoard);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutBoard);
  if (window.ResizeObserver) new ResizeObserver(layoutBoard).observe(panels);

  render();
})();

</script>
</body>
</html>
